# X1 Terminal on node01: sentiment tape -> EC2 mood-api (Mood Ring scores), read-only.
# Goes inside the `server { listen 8088; ... }` block of /etc/nginx/sites-available/x1-terminal, ABOVE
# `location ^~ /api/ { return 404; }` (an exact `location =` wins over the ^~ prefix either way).
#
# Path: browser -> https://terminal.x1.xyz/api/auto-trader-signal?view=sent (same origin, so the CSP is unchanged)
#       -> HAProxy -> nginx :8088 -> https://dtdi1o7ykdc6.cloudfront.net/api/daytraders?view=sent
#       -> CloudFront (10 s cache, GET/HEAD/OPTIONS only) -> EC2 mood-api :8091 (security group: CloudFront only).
# No EC2 firewall or security-group change is needed. mood-api is GET-only and holds no user data.

location = /api/auto-trader-signal {
    # Only the views the terminal uses; anything else is refused here, before leaving the box.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($arg_view !~ ^(sent|sent_auto)$) { return 400; }

    # A variable upstream + resolver re-resolves CloudFront's rotating IPs (a literal host is resolved once, at reload).
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 3s;
    set $mood_api https://dtdi1o7ykdc6.cloudfront.net;
    rewrite ^ /api/daytraders break;               # query string (?view=...) is kept
    proxy_pass $mood_api;

    proxy_ssl_server_name on;
    proxy_ssl_name dtdi1o7ykdc6.cloudfront.net;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host dtdi1o7ykdc6.cloudfront.net;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Send nothing about the visitor upstream.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;   # same-origin now; no CORS needed

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_buffering on;

    add_header Cache-Control "public, max-age=10" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
